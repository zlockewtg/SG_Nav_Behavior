# ──────────────────────────────────────────────────────────────
# SG-Nav minimal config for OmniGibson / HTTP server
# ──────────────────────────────────────────────────────────────

# ── Simulator geometry (must match OmniGibson sensor config) ──
SIMULATOR:
  TURN_ANGLE: 20
  TILT_ANGLE: 30
  FORWARD_STEP_SIZE: 0.25
  AGENT_0:
    HEIGHT: 0.88
    RADIUS: 0.18
  RGB_SENSOR:
    WIDTH: 720
    HEIGHT: 720
    HFOV: 99
  DEPTH_SENSOR:
    WIDTH: 720
    HEIGHT: 720
    HFOV: 99
    NORMALIZE_DEPTH: false
    MIN_DEPTH: 0.1
    MAX_DEPTH: 8

TASK:
  TYPE: ObjectNav-v1
  POSSIBLE_ACTIONS: ["STOP", "MOVE_FORWARD", "TURN_LEFT", "TURN_RIGHT", "LOOK_UP", "LOOK_DOWN", "TURN_RIGHT_2"]
  SENSORS: []
  MEASUREMENTS: []

DATASET:
  TYPE: ObjectNav-v1
  SPLIT: val
  DATA_PATH: ""
  SCENES_DIR: ""

# ──────────────────────────────────────────────────────────────
# SG-Nav runtime parameters
# ──────────────────────────────────────────────────────────────
SGNAV_RUNTIME:

  # ── Server / startup ──────────────────────────────────────
  warmup: true
  warmup_runs: 2
  # Optional: local HF snapshot dir for bert-base-uncased (tokenizer + config + weights).
  # Empty = load from Hugging Face Hub (needs network or existing cache).
  # One-time download example:
  #   huggingface-cli download google-bert/bert-base-uncased --local-dir models/bert-base-uncased
  # Or: python -c "from huggingface_hub import snapshot_download; snapshot_download('bert-base-uncased', local_dir='models/bert-base-uncased')"
  # Then set (paths relative to SG-Nav cwd): bert_base_uncased_path: "models/bert-base-uncased"
  # Override without yaml: export SGNAV_BERT_BASE_UNCASED_PATH=/abs/path/to/bert-base-uncased
  bert_base_uncased_path: "/mnt/public/tgy/SG-Nav/models/bert-base-uncased" # models/bert-base-uncased

  # ── Coordinate transform ──────────────────────────────────
  # Depth wedge → robot forward offset (Semantic_Mapping uses heading−90°).
  compass_offset_deg: -90.0
  map_frame_fixed_mode: flipud

  # ── Map construction thresholds ───────────────────────────
  map_size_cm: 6000
  # First gps after /reset is episode origin so the agent starts at global map center on the grid.
  gps_episode_rebase: true
  sem_map_pred_threshold: 2.0
  sem_exp_pred_threshold: 2.5
  free_map_pred_threshold: 0.5
  free_exp_pred_threshold: 0.5

  # ── Camera extrinsics (from OG camera_pose_world) ────────
  camera_tilt_source: cam_z_down
  camera_height_fallback_cm: 100.0
  camera_pitch_min_deg: -45.0
  camera_pitch_max_deg: 45.0
  camera_height_min_cm: 120.0
  camera_height_max_cm: 220.0
  camera_height_reject_min_cm: 120.0
  camera_height_reject_max_cm: 210.0
  camera_extrinsic_reject_motion_delta: true
  camera_pitch_reject_delta_deg: 6.0
  camera_height_reject_delta_cm: 8.0

  # ── Depth→map vertical bands (cm) ────────────────────────
  map_obstacle_min_z_cm: 25.0
  map_free_min_z_cm: -150.0
  map_free_max_z_cm: 25.0

  # ── Mapping suspension on fall / collision ────────────────
  map_suspend_on_fall: true
  map_suspend_steps_on_fall: 4
  map_suspend_roll_deg: 85.0
  map_suspend_pitch_deg: 50.0
  map_suspend_height_cm: 95.0
  map_suspend_height_delta_cm: 20.0

  # ── Traversible generation ────────────────────────────────
  traversible_obstacle_inflation_m: 0.15
  traversible_occ_from_depth_min: 0.45
  traversible_clear_robot_obs_enable: true
  traversible_clear_robot_obs_radius_m: 1.0
  traversible_free_map_min: 0.25
  traversible_bootstrap_enable: true
  traversible_bootstrap_min_free_ratio: 0.002
  traversible_bootstrap_radius_m: 0.9

  # ── FMM planner ───────────────────────────────────────────
  planner_align_angle_deg: 30.0
  planner_align_hysteresis_deg: 5.0
  planner_face_goal_max_error_deg: 30.0
  fmm_step_size: 3
  fmm_stop_cond: 1.0
  collision_threshold_m: 0.08

  # ── Goal approach / stop ──────────────────────────────────
  goal_distance_threshold: 8.0
  goal_stop_distance_threshold_m: 0.3
  goal_stop_face_threshold_deg: 12.0
  gt_pathplan_when_target_on_map: true
  panorama_spin_until_step: 22

  # ── GLIP / Scene Graph ────────────────────────────────────
  detect_interval: 5
  scenegraph_update_interval: 5
  show_frame_nodes_only: true
  glip_append_goal_sg: true
  save_scenegraph_json: false

  # ── Visualization ─────────────────────────────────────────
  visualize_centered_crop_ratio: 0.3
  # Shift occupancy panel so episode-start robot cell is at (map_size//2, map_size//2); planning unchanged.
  visualize_align_start_to_map_center: true

  # ── OmniGibson eval_skill movement defaults ───────────────
  # (read by eval script, not SG_Nav.py)
  behavior_forward_vel: 0.5
  behavior_turn_vel: 1.75
  behavior_physics_steps_per_nav_step: 2
  behavior_position_forward_step_size_m: 0.02
  behavior_position_turn_angle_deg: 5
  behavior_position_physics_steps_per_nav_step: 1
  behavior_position_forward_physics_steps_per_nav_step: 6
  behavior_position_turn_physics_steps_per_nav_step: 11
  behavior_position_physical_look_pitch_step_deg: 5
  behavior_look_pitch_sign: -1
  behavior_physical_look_pitch_limit_margin_deg: 10

  # ── Scene-graph edge LLM ──────────────────────────────────
  scenegraph:
    skip_edge_llm: false
